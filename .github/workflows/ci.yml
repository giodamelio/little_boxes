name: CI
on:
  push:
    # Tag pushes point at a commit that already ran this on its branch
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Purging superseded Nix store caches goes through the Actions cache API
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6 #v12
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 #v22
        with:
          # Recommended by cache-nix-action so garbage collection keeps build inputs of live paths
          extra-conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 #v7
        with:
          primary-key: ci-nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: ci-nix-${{ runner.os }}-
          # Holds the pinned toolchain and the devshell as well as the checks' build inputs
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: ci-nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c #v17
        with:
          name: giodamelio
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build, lint and test in the Nix sandbox
        run: nix flake check -L
      - name: Check formatting
        run: nix fmt -- --fail-on-change
      # nix flake check covers rustfmt, clippy and the tests, and the Commits workflow covers
      # committed, which needs the full history
      - name: Run the hooks nix flake check does not cover
        run: nix develop -c prek run --all-files actionlint unused-deps unused-dev-deps cargo-deny
      - name: Run the package
        run: find . -maxdepth 1 | nix run

  nightly:
    name: Nightly canary
    runs-on: ubuntu-latest
    # Reports breakage coming on rust-toolchains' pinned nightly without failing the workflow
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 #v22
      - name: Build and test on nightly
        run: nix build .#nightly -L
