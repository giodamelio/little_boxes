name: Run Hooks
on:
  push:
    # Tag pushes point at a commit that already ran this on its branch
    branches: ["**"]
  pull_request:
jobs:
  detect-hooks:
    name: Detect Prek Hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Purging superseded Nix store caches goes through the Actions cache API
      actions: write
    outputs:
      hooks: ${{ steps.list-hooks.outputs.hooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@92148bb48b9a0c5458c53dd0b368fbfbfbaa3210 #main
        with:
          # Recommended by cache-nix-action so garbage collection keeps build inputs of live paths
          extra-conf: |
            keep-env-derivations = true
            keep-outputs = true
      # Only this job saves the cache, so the matrix jobs don't race to upload the same store
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 #v7
        with:
          primary-key: hooks-nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: hooks-nix-${{ runner.os }}-
          # The dev shell closure is about 2.5 GiB
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: hooks-nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: List hooks
        id: list-hooks
        # The profile is a GC root, so garbage collection before saving the cache keeps the dev shell
        run: |
          nix develop --profile "$RUNNER_TEMP/devshell" -c sh -c 'prek list --output-format=json > /tmp/hooks.json'
          hooks=$(jq -c '[.[].full_id]' /tmp/hooks.json)
          echo "hooks=$hooks" >> "$GITHUB_OUTPUT"
  run-hooks:
    needs: detect-hooks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook: ${{ fromJson(needs.detect-hooks.outputs.hooks) }}
    name: Run ${{ matrix.hook }} hook
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
        with:
          # The committed hook lints a range of past commits, so it needs the full history
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@92148bb48b9a0c5458c53dd0b368fbfbfbaa3210 #main
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 #v7
        with:
          primary-key: hooks-nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: hooks-nix-${{ runner.os }}-
          save: false
      - name: Run ${{ matrix.hook }}
        run: nix develop -c prek run ${{ matrix.hook }} --all-files
