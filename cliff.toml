# git-cliff configuration: https://git-cliff.org/docs/configuration
# CHANGELOG.md and each GitHub release's notes are generated from conventional commit messages.
# AGENTS.md documents the commit types and RELEASING.md the commands.

[changelog]
header = """
# Changelog\n
All notable changes to little_boxes are recorded here. The format follows \
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the project uses \
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://git-cliff.org) from commit messages. \
Do not edit it by hand. Changes before 1.13.0 are listed on \
[the GitHub releases page](https://github.com/giodamelio/little_boxes/releases).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}\
            {{ commit.message | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/giodamelio/little_boxes/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/giodamelio/little_boxes/releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/giodamelio/little_boxes/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# History before 1.13.0 predates conventional commits and is left out
filter_unconventional = true
split_commits = false
# Only v-prefixed tags are releases; the older bare 1.x.0 tags come from a previous release process
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# The <!-- N --> prefixes fix the section order and are stripped from the headings
commit_parsers = [
    { footer = "^[Cc]hangelog: *skip$", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^revert", group = "<!-- 3 -->Reverted" },
    { message = "^(refactor|test|docs|ci|build|chore|style)", skip = true },
]
filter_commits = true
protect_breaking_commits = true
topo_order = false
sort_commits = "oldest"
