[package]
authors = ["Gio d'Amelio <gio@damelio.net>"]
description = "Adds boxes around stdin. Optionally adds a title"
documentation = "https://github.com/giodamelio/little_boxes"
license = "MIT"
name = "little_boxes"
repository = "https://github.com/giodamelio/little_boxes"
version = "1.14.0"
edition = "2024"
# Everything else is repo tooling. .cargo/config.toml in particular points cargo at vendor/,
# which is not published, so shipping it would break builds of the published crate.
include = ["/src/**/*.rs", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[dependencies]
clap = {version = "4.6.1", features = ["default", "cargo"]}
strip-ansi-escapes = "0.2.1"
anyhow = "1.0.104"
unicode-width = "0.2.2"
vte = {version = "0.14.1", default-features = false}
clap_mangen = "0.2.33"
clap_complete = "4.6.2"
clap_complete_nushell = "4.6.0"

[dev-dependencies]
trycmd = {version = "0.15.11", features = ["default"]} # add "debug" feature if you're having trouble

[features]

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Doc-section lints are aimed at published library APIs, not application code.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
